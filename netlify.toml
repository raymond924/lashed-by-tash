# Netlify settings for the Lashed By Tash site (deploy repository).
# Built from the source project with tools/publish_repo.sh; edit the source, not this repo.
[build]
  command = ""
  publish = "public"

# The booking assistant's optional Claude endpoint (needs ANTHROPIC_API_KEY in Netlify)
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
